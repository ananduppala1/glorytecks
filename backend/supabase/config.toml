# Supabase CLI project configuration.
# `project_id` is a local label; link a real project with `supabase link`.
project_id = "glorytecks-cms"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
# Guard rail: a runaway client cannot ask PostgREST for an unbounded result set.
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# NO PUBLIC SIGNUP.
# Administrators are provisioned by an existing admin (POST /admins) or by
# `npm run seed:admin`. This mirrors the previous behaviour, where the API
# exposed no registration route at all.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = true
